[project]
name = "cyberfs"
version = "0.1.0"
description = "Backend filesystem service with sharing, optional content encryption, and usage analytics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "minio>=7.2",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44.0",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "respx>=0.22",
    "freezegun>=1.5",
    # Exercises the S3 surface with an unmodified client in the integration
    # suite; those tests skip gracefully when it is absent.
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberfs"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit
    "ASYNC",
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests; production code is checked by review
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["cyberfs"]

[[tool.mypy.overrides]]
module = ["minio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires live Postgres, Redis, or MinIO",
    "e2e: requires a running API",
]

[tool.coverage.run]
source = ["src/cyberfs/domain", "src/cyberfs/application"]
branch = true

[tool.coverage.report]
# The floor applies to domain/ and application/ only -- that is where the logic
# lives and where it is testable without I/O. Adapters are covered by the
# integration suite against real Postgres, Redis, and MinIO.
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "@overload",
    "\\.\\.\\.$",
]
