name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  UV_VERSION: "0.9.17"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      # Coverage floor (>90% on domain/ and application/) is enforced by
      # [tool.coverage.report].fail_under in pyproject.toml.
      - name: Unit tests with coverage floor
        run: uv run pytest tests/unit --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberfs
          POSTGRES_PASSWORD: cyberfs
          POSTGRES_DB: cyberfs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cyberfs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # MinIO is started as a step below, not as a service container: the
      # official image needs a `server /data` command, which the `services`
      # block cannot pass, and Bitnami removed the tag this job used to rely on.

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://cyberfs:cyberfs@localhost:5432/cyberfs
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: cyberfs
      MINIO_SECRET_KEY: cyberfs-dev-secret
      MINIO_BUCKET: cyberfs-content
      MINIO_SECURE: "false"
      CYBERDYNE_AUTH_BASE_URL: https://auth.example.test
      CYBERFS_CLIENT_ID: cyberfs
      CYBERFS_CLIENT_SECRET: ci-client-secret
      MASTER_KEY: ZGV2LW9ubHktbWFzdGVyLWtleS1kby1ub3QtdXNlISE=

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      # The official minio image (pinned, same as compose.coolify.yaml) rather
      # than a service container: it needs a `server` command the services block
      # cannot supply. The app provisions its own bucket at startup
      # (ensure_bucket in the lifespan), so no bucket is pre-created here.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=cyberfs \
            -e MINIO_ROOT_PASSWORD=cyberfs-dev-secret \
            minio/minio:RELEASE.2024-10-13T13-34-11Z \
            server /data --console-address ":9001"
          for i in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/ready >/dev/null; then
              echo "MinIO ready"; exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready"; docker logs minio; exit 1

      # pg_dump / pg_restore back the MetadataDump adapter; without them the
      # backup/restore round trip (backup-restore/spec.md, "Restore is tested
      # automatically") would skip instead of running in CI.
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Migrations arrive with the data model (tasks 3.4). Until then this job
      # has nothing to run; the guard lifts itself as soon as alembic.ini lands
      # rather than needing a workflow edit.
      - name: Detect migrations
        id: detect
        run: echo "ready=${{ hashFiles('alembic.ini') != '' }}" >> "$GITHUB_OUTPUT"

      - name: Run migrations
        if: steps.detect.outputs.ready == 'true'
        run: uv run alembic upgrade head

      # Includes the backup/restore round trip -- `backup-restore/spec.md`
      # requires the restore to be exercised in CI, not merely documented.
      - name: Integration tests
        if: steps.detect.outputs.ready == 'true'
        run: uv run pytest tests/integration -m integration

  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @fission-ai/openspec@latest
      - run: openspec validate --all --strict
